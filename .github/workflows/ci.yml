name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: sidebar/package-lock.json
      - run: python3 -m unittest discover -s tests -v
      - run: npm ci && npm run build && npm run build:plugin && npm test && npm run test:sites
        working-directory: sidebar
      - run: npm pack
        working-directory: sidebar/dist/plugin
